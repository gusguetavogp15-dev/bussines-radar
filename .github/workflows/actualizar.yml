# Bussines Radar · actualización diaria en la nube
# Cada mañana recoge los más vendidos, las búsquedas y las noticias, guarda el historial
# en el repositorio y publica la app en GitHub Pages. No necesita ninguna Mac encendida.
name: Actualización diaria

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 en República Dominicana
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths-ignore: ['data/**', 'estado/**']

concurrency:
  group: actualizacion
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recoger datos
        if: github.event_name != 'push'
        env:
          BR_DATA: estado
        run: python3 server.py --once --export data

      - name: Exportar datos guardados
        if: github.event_name == 'push'
        env:
          BR_DATA: estado
        run: python3 server.py --export data

      - name: Guardar historial en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "Bussines Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data estado
          git diff --cached --quiet || git commit -m "Datos del $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
